<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Pink Lily Bouquet</title>
  <style>
    :root{
      --bg: #050505;
      --bg2: #0d0710;
      --pink-1: #ffe4f1;
      --pink-2: #ffb6d8;
      --pink-3: #ff7ec7;
      --pink-4: #e33788;
      --pink-5: #b91568;
      --stem-dark: #123926;
      --stem-mid: #2c704c;
      --stem-light: #7ad7a4;
      --leaf-1: #9af0b9;
      --leaf-2: #1a5f3d;
      --glow: rgba(255, 126, 199, 0.45);
      --spark: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 118, 192, 0.10), transparent 20%),
        radial-gradient(circle at 50% 75%, rgba(255, 136, 197, 0.08), transparent 25%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    }

    .scene {
      position: relative;
      width: min(95vw, 1200px);
      height: min(95vh, 900px);
      overflow: hidden;
      background: transparent;
      filter: saturate(1.1);
    }

    .bloom-glow {
      position: absolute;
      left: 50%;
      bottom: 90px;
      width: 620px;
      height: 620px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,125,200,0.22), rgba(255,125,200,0.09) 32%, transparent 68%);
      filter: blur(10px);
      opacity: 0;
      animation: aura 3.8s ease-out 0.4s forwards;
    }

    .bouquet {
      position: absolute;
      left: 50%;
      bottom: -10px;
      width: 660px;
      height: 760px;
      transform: translateX(-50%);
      animation: bouquetFloat 9s ease-in-out infinite alternate;
    }

    .stem {
      position: absolute;
      bottom: 0;
      width: 16px;
      border-radius: 18px;
      opacity: 0;
      background: linear-gradient(90deg, var(--stem-dark), var(--stem-mid), var(--stem-light));
      box-shadow:
        inset 0 0 10px rgba(255,255,255,0.12),
        0 0 16px rgba(130, 247, 183, 0.15);
      transform-origin: bottom center;
      animation:
        stemGrow 2.2s cubic-bezier(.18, .88, .22, 1) forwards,
        sway 7s ease-in-out infinite alternate;
      animation-delay: var(--d), calc(var(--d) + 1.4s);
    }

    .stem::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(to bottom, rgba(255,255,255,0.20), transparent 28%);
    }

    .leaf {
      position: absolute;
      width: 82px;
      height: 44px;
      border-radius: 58% 0 58% 0;
      background: linear-gradient(135deg, var(--leaf-1), var(--leaf-2));
      opacity: 0;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.12);
      animation: leafPop 1.3s ease-out forwards;
      animation-delay: calc(var(--d) + 0.9s);
      transform-origin: center center;
    }

    .leaf::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.25);
      transform: translateX(-50%) rotate(17deg);
      border-radius: 50%;
    }

    .flower {
      position: absolute;
      width: 170px;
      height: 170px;
      left: 50%;
      top: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2) rotate(-14deg);
      animation: bloom 2.2s cubic-bezier(.12,.75,.25,1) forwards;
      animation-delay: var(--d);
      filter: drop-shadow(0 14px 28px rgba(255, 126, 199, 0.22));
    }

    .flower-wrap {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      animation: flowerSway 5s ease-in-out infinite alternate;
      animation-delay: calc(var(--d) + 1s);
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82px;
      height: 118px;
      margin-left: -41px;
      margin-top: -59px;
      border-radius: 60% 60% 60% 60%;
      background: linear-gradient(180deg, var(--pink-1), var(--pink-2) 38%, var(--pink-4) 100%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        inset 0 0 16px rgba(255,255,255,0.18),
        0 0 12px rgba(255, 120, 188, 0.18);
      transform-origin: 50% 100%;
      animation: petalFloat 5s ease-in-out infinite alternate;
    }

    .petal:nth-child(1) { transform: rotate(0deg) translateY(-26px); animation-delay: 0.1s; }
    .petal:nth-child(2) { transform: rotate(60deg) translateY(-26px); animation-delay: 0.2s; }
    .petal:nth-child(3) { transform: rotate(120deg) translateY(-26px); animation-delay: 0.3s; }
    .petal:nth-child(4) { transform: rotate(180deg) translateY(-26px); animation-delay: 0.4s; }
    .petal:nth-child(5) { transform: rotate(240deg) translateY(-26px); animation-delay: 0.5s; }
    .petal:nth-child(6) { transform: rotate(300deg) translateY(-26px); animation-delay: 0.6s; }

    .flower-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7fb, #fcb8dc 24%, #e85aa6 44%, #a81d68 100%);
      box-shadow:
        0 0 14px rgba(255, 142, 209, 0.9),
        0 0 36px rgba(255, 137, 212, 0.4);
      z-index: 4;
    }

    .stem-1 { left: 47%; height: 294px; --d: 0.6s; }
    .stem-2 { left: 56%; height: 342px; --d: 1.1s; }
    .stem-3 { left: 63%; height: 286px; --d: 1.7s; }
    .stem-4 { left: 40%; height: 324px; --d: 2.2s; }
    .stem-5 { left: 68%; height: 332px; --d: 2.8s; }

    .flower-1 { left: 46%; bottom: 210px; --d: 1.7s; }
    .flower-2 { left: 54%; bottom: 305px; --d: 2.4s; }
    .flower-3 { left: 61%; bottom: 245px; --d: 3.1s; }
    .flower-4 { left: 39%; bottom: 280px; --d: 3.7s; }
    .flower-5 { left: 69%; bottom: 305px; --d: 4.3s; }

    .sparkles,
    .falling-petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,1), rgba(255,255,255,0.7) 35%, rgba(255,166,219,0.5) 60%, transparent 70%);
      box-shadow: 0 0 14px rgba(255, 167, 215, 0.8);
      opacity: 0;
      animation: twinkle 3.5s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .falling-petal {
      position: absolute;
      left: 50%;
      top: -10%;
      width: var(--size);
      height: calc(var(--size) * 1.4);
      border-radius: 70% 0 70% 0;
      background: linear-gradient(135deg, rgba(255, 232, 244, 0.95), rgba(255, 140, 200, 0.85), rgba(192, 33, 128, 0.75));
      box-shadow: 0 0 12px rgba(255, 146, 208, 0.35);
      transform: rotate(0deg);
      opacity: 0;
      animation: petalDrop var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes stemGrow {
      0% {
        opacity: 0;
        transform: scaleY(0.06) translateY(28px);
      }
      35% { opacity: 1; }
      100% {
        opacity: 1;
        transform: scaleY(1) translateY(0);
      }
    }

    @keyframes sway {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }

    @keyframes leafPop {
      0% {
        opacity: 0;
        transform: scale(0.18) rotate(-30deg);
      }
      70% { opacity: 1; }
      100% {
        opacity: 1;
        transform: scale(1) rotate(10deg);
      }
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.09) rotate(-20deg) translateY(70px);
        filter: blur(12px);
      }
      35% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes petalFloat {
      0% {
        transform: rotate(0deg) scale(1) translateY(0);
      }
      100% {
        transform: rotate(7deg) scale(1.05) translateY(-4px);
      }
    }

    @keyframes flowerSway {
      0% { transform: rotate(-6deg); }
      100% { transform: rotate(6deg); }
    }

    @keyframes aurora {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.7);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1.06);
      }
    }

    @keyframes aura {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.75);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1.12);
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0.6);
      }
      30%, 70% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @keyframes petalDrop {
      0% {
        opacity: 0;
        transform: translate3d(0, -30px, 0) rotate(0deg) scale(0.7);
      }
      15% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 730px, 0) rotate(420deg) scale(1.18);
      }
    }

    @keyframes bouquetFloat {
      0% { transform: translateX(-50%) translateY(10px) scale(0.98); }
      100% { transform: translateX(-50%) translateY(-8px) scale(1.02); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="bloom-glow"></div>

    <div class="bouquet">
      <div class="stem stem-1">
        <div class="leaf" style="left:-16px; top:28%; transform:rotate(-22deg);"></div>
        <div class="leaf" style="right:-18px; top:40%; transform:rotate(18deg);"></div>
      </div>

      <div class="stem stem-2">
        <div class="leaf" style="left:-18px; top:24%; transform:rotate(-20deg);"></div>
        <div class="leaf" style="right:-16px; top:56%; transform:rotate(12deg);"></div>
      </div>

      <div class="stem stem-3">
        <div class="leaf" style="left:-12px; top:38%; transform:rotate(-14deg);"></div>
        <div class="leaf" style="right:-12px; top:22%; transform:rotate(18deg);"></div>
      </div>

      <div class="stem stem-4">
        <div class="leaf" style="left:-24px; top:30%; transform:rotate(-28deg);"></div>
        <div class="leaf" style="right:-16px; top:46%; transform:rotate(16deg);"></div>
      </div>

      <div class="stem stem-5">
        <div class="leaf" style="left:-16px; top:24%; transform:rotate(-14deg);"></div>
        <div class="leaf" style="right:-10px; top:52%; transform:rotate(22deg);"></div>
      </div>

      <div class="flower flower-1">
        <div class="flower-wrap">
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="flower-core"></span>
        </div>
      </div>

      <div class="flower flower-2">
        <div class="flower-wrap">
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="flower-core"></span>
        </div>
      </div>

      <div class="flower flower-3">
        <div class="flower-wrap">
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="flower-core"></span>
        </div>
      </div>

      <div class="flower flower-4">
        <div class="flower-wrap">
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="flower-core"></span>
        </div>
      </div>

      <div class="flower flower-5">
        <div class="flower-wrap">
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="flower-core"></span>
        </div>
      </div>
    </div>

    <div class="sparkles" id="sparkles"></div>
    <div class="falling-petals" id="petals"></div>
  </div>

  <script>
    const sparkleLayer = document.getElementById("sparkles");
    const petalLayer = document.getElementById("petals");

    for (let i = 0; i < 50; i++) {
      const sparkle = document.createElement("span");
      sparkle.className = "sparkle";

      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const size = (Math.random() * 8 + 5).toFixed(2) + "px";
      const delay = (Math.random() * 4.5).toFixed(2) + "s";

      sparkle.style.left = x + "%";
      sparkle.style.top = y + "%";
      sparkle.style.width = size;
      sparkle.style.height = size;
      sparkle.style.setProperty("--delay", delay);
      sparkle.style.animationDuration = (2.6 + Math.random() * 3.2).toFixed(2) + "s";

      sparkleLayer.appendChild(sparkle);
    }

    for (let i = 0; i < 20; i++) {
      const petal = document.createElement("span");
      petal.className = "falling-petal";

      const size = (10 + Math.random() * 16).toFixed(2) + "px";
      const duration = (5 + Math.random() * 6).toFixed(2) + "s";
      const delay = (Math.random() * 8).toFixed(2) + "s";
      const drift = ((Math.random() * 160) - 80).toFixed(2) + "px";

      petal.style.setProperty("--size", size);
      petal.style.setProperty("--duration", duration);
      petal.style.setProperty("--delay", delay);
      petal.style.setProperty("--drift", drift);

      const left = (8 + Math.random() * 84).toFixed(2) + "%";
      petal.style.left = left;

      petalLayer.appendChild(petal);
    }
  </script>
</body>
</html>
